<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#042341">
  <title>You're offline · Nexpreneur OS</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f7f8fb; color: #042341; }
    main { max-width: 360px; padding: 32px 24px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { color: #5b6577; line-height: 1.5; margin: 0 0 20px; }
    button { height: 44px; padding: 0 22px; border: 0; border-radius: 12px; background: #042341; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    @media (prefers-color-scheme: dark) { body { background: #0b1522; color: #e8eef7; } p { color: #9aa7bb; } button { background: #f15a24; } }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" width="72" height="72">
    <h1>You're offline</h1>
    <p>Nexpreneur OS needs a connection to show your latest bookings and invoices. Check your internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
